# One-time bootstrap maintenance workflow. Remove this file after the first run succeeds.
name: Remove bootstrap latest tag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-latest:
    name: Keep beta off npm latest
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Remove the bootstrap latest dist-tag
        run: npm dist-tag rm n8n-nodes-aps latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
