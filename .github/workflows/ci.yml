name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22'
          - 'lts/*'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        # The package has no runtime dependencies. n8n-workflow is a peer
        # dependency supplied by the host installation, so high-severity
        # transitive findings are tracked upstream; critical findings still
        # fail this package's CI.
        run: npm audit --omit=dev --audit-level=critical

      - name: Verify npm package contents
        run: npm run pack:check

      - name: Install the tarball in clean n8n
        if: matrix.node-version == '22'
        run: npm run smoke:install
        env:
          N8N_SMOKE_VERSION: '2.33.7'
